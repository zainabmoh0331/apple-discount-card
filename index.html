<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<link rel="shortcut icon" href="icons8-apple-fruit-48.png" type="image/x-icon">
<title>Delicious Apples</title>
</head>
<body>

  <div class="product-wrapper">
    <div class="card-bg">
      
      <!-- Left Image Card -->
      <div class="image-section">
        <div class="image-header">
          <span>☰</span>
          <span>♡</span>
        </div>
        <div class="main-img">
          <img id="mainImage" src="green apple.jpg" alt="Green Apple">
        </div>
        <div class="thumbnails">
          <img src="icons8-red-apple-48.png" class="active" alt="">
          <img src="icons8-green-apple-48.png" alt="">
          <img src="icons8-bitten-apple-50 (1).png" alt="">
          <img src="icons8-bitten-apple-50.png" alt="">
        </div>
      </div>

      <!-- Right Info Card -->
      <div class="info-section">
        <h2>Delicious Apples</h2>
        <strong>COD: 45999</strong>
        
        <div class="price"><span>Rs</span> 7.93</div>
        
        <div class="color-options">
          <img src="icons8-green-apple-48.png" alt="">
          <img src="icons8-lemon-48.png" alt="">
          <img src="icons8-orange-50.png" alt="">
          <img src="icons8-red-apple-48.png" alt="">
        </div>

        <div class="benefits">
          <strong>BENEFITS</strong>
          <ul>
            <li>Apples are nutritious</li>
            <li>Apples may be good for weight loss</li>
            <li>Apples may be good for bone health</li>
            <li>They're linked to a lower risk of diabetes</li>
          </ul>
        </div>

        <button class="add-to-cart">ADD TO CART</button>
      </div>

    </div>
  </div>
</body>
</html>
